  <g transform="translate(28, 16) scale(1)">
    <path d="M64 8L108 26V58C108 87.5 89 109.5 64 120C39 109.5 20 87.5 20 58V26L64 8Z" fill="url(#lw-logo-bg)" stroke="#38bdf8" stroke-opacity="0.45" stroke-width="2" />
