  <text x="238" y="108" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14.5" font-weight="600" letter-spacing="0.06em">CORDIS 4 LOCAL AGENT SECURITY PLATFORM</text>
